

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>校园应急救护系统</title>
<!-- 新版 GL JS API -->
<script src="https://map.qq.com/api/gljs?v=1.exp&key=6WOBZ-EEELQ-VSD5J-BQPIQ-Q2HQ6-AWFQN"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emergency: '#E53935',
                        'emergency-dark': '#C62828',
                        'emergency-light': '#FFEBEE',
                        medical: '#00897B',
                        'medical-light': '#E0F2F1'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        
        * {
            font-family: 'Noto Sans SC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        #map {
            z-index: 1;
            touch-action: manipulation;
            user-select: none;
        }
        
        body {
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        
        .bottom-nav {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .emergency-btn {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(229, 57, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); }
        }
        
        @keyframes float-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .card-press {
            transition: all 0.2s ease;
        }
        
        .card-press:active {
            transform: scale(0.96);
        }
        
        .modal-enter {
            animation: slide-up 0.3s ease-out;
        }
        
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(229, 57, 53, 0.1);
            border-top-color: #E53935;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(229, 57, 53, 0.3);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .knowledge-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .cpr-card { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .heimlich-card { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .bleeding-card { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .heatstroke-card { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .fracture-card { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        
        .page-hidden {
            display: none;
        }
        
        .tab-active {
            color: #E53935;
        }
        
        .detail-slide {
            animation: slide-in-right 0.3s ease-out;
        }
        
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .text-gradient {
            background: linear-gradient(135deg, #E53935 0%, #FF5252 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .shadow-glow {
            box-shadow: 0 4px 20px rgba(229, 57, 53, 0.15);
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #E53935 0%, #FF5252 100%);
        }
        
        .nav-active {
            background: rgba(229, 57, 53, 0.1);
            color: #E53935;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col overflow-hidden">

    <!-- 加载界面 -->
    <div id="loading-screen" class="fixed inset-0 bg-gradient-to-br from-gray-50 via-white to-red-50 z-50 flex flex-col items-center justify-center">
        <div class="relative mb-6">
            <div class="loading-spinner"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <svg class="w-8 h-8 text-emergency" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                </svg>
            </div>
        </div>
        <div class="text-xl font-black text-gradient mb-2">校园应急救护</div>
        <div class="text-sm text-gray-500 font-medium">正在获取您的位置信息...</div>
        <div class="mt-8 flex items-center gap-1">
            <div class="w-2 h-2 bg-emergency rounded-full animate-bounce" style="animation-delay: 0ms"></div>
            <div class="w-2 h-2 bg-emergency rounded-full animate-bounce" style="animation-delay: 150ms"></div>
            <div class="w-2 h-2 bg-emergency rounded-full animate-bounce" style="animation-delay: 300ms"></div>
        </div>
    </div>

    <!-- 顶部标题栏 -->
    <header id="main-header" class="glass-effect shadow-sm z-40 px-4 py-3 flex items-center justify-between border-b border-white/20">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-emergency to-red-400 rounded-xl flex items-center justify-center shadow-lg shadow-red-200">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-black text-gradient leading-tight">校园应急救护</h1>
                <p class="text-xs text-gray-500 font-medium" id="header-subtitle">保护生命，分秒必争</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div id="location-status" class="flex items-center gap-2 text-xs bg-gray-100/80 px-3 py-1.5 rounded-full backdrop-blur-sm">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-gray-700 font-medium">定位中</span>
            </div>
            <button onclick="navigateToNearestAED()" class="bg-emergency text-white px-4 py-2 rounded-full text-sm font-bold card-press shadow-lg flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                导航最近
            </button>
        </div>
    </header>

    <!-- 主内容区 -->
    <main id="main-content" class="flex-1 overflow-hidden relative">
        
        <!-- 地图页 -->
        <div id="map-page" class="absolute inset-0 bg-gray-100 overflow-hidden">
            <div id="map" class="w-full h-full"></div>
        </div>

        <!-- 急救知识页 -->
        <div id="knowledge-page" class="absolute inset-0 bg-gray-50 overflow-y-auto page-hidden pb-20">
            <div class="p-4">
                <h2 class="text-xl font-black mb-1">急救知识</h2>
                <p class="text-sm text-gray-500 mb-4">关键时刻能救命的基础急救技能</p>
                
                <div id="knowledge-cards" class="grid grid-cols-1 gap-4">
                    <!-- 动态生成卡片 -->
                </div>
            </div>
        </div>

        <!-- 急救知识详情页 -->
        <div id="knowledge-detail-page" class="absolute inset-0 bg-white overflow-y-auto page-hidden z-30">
            <div class="sticky top-0 bg-white z-10 px-4 py-3 flex items-center gap-3 shadow-sm">
                <button onclick="closeKnowledgeDetail()" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="text-lg font-bold" id="detail-title">详情</div>
            </div>
            <div id="detail-content" class="p-4 pb-20">
                <!-- 动态生成内容 -->
            </div>
        </div>
    </main>

    <!-- AED详情弹窗 -->
    <div id="aed-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end">
        <div class="bg-white w-full rounded-t-3xl max-h-[85vh] overflow-y-auto modal-enter shadow-2xl">
            <div class="sticky top-0 bg-white px-5 py-4 border-b border-gray-100 flex items-center justify-between z-10">
                <h3 class="text-lg font-black text-gray-800">AED设备详情</h3>
                <button onclick="closeAEDModal()" class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center card-press">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <div id="aed-modal-content" class="p-5">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>

    <!-- 紧急呼叫面板 -->
    <div id="emergency-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end">
        <div class="bg-white w-full rounded-t-3xl p-6 modal-enter">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
            <h2 class="text-2xl font-black text-center mb-2 text-emergency">紧急呼叫</h2>
            <p class="text-center text-gray-500 text-sm mb-6">请保持冷静，准确说明事发地点和情况</p>
            
            <div class="space-y-4">
                <button onclick="callNumber('120')" class="w-full bg-emergency hover:bg-emergency-dark text-white py-5 rounded-2xl shadow-xl card-press flex items-center justify-center gap-3">
                    <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                        </svg>
                    </div>
                    <div class="text-left">
                        <div class="text-2xl font-black">拨打 120</div>
                        <div class="text-sm text-white/80">急救中心</div>
                    </div>
                </button>

                <button onclick="callHospital()" class="w-full bg-medical hover:bg-teal-700 text-white py-5 rounded-2xl shadow-xl card-press flex items-center justify-center gap-3">
                    <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                    </div>
                    <div class="text-left">
                        <div class="text-2xl font-black" id="hospital-phone">010-12345678</div>
                        <div class="text-sm text-white/80" id="hospital-label">校医院 · 本部校区</div>
                    </div>
                </button>
            </div>
            <div class="mt-6 bg-amber-50 border border-amber-200 rounded-xl p-4">
                <div class="flex items-start gap-2">
                    <svg class="w-5 h-5 text-amber-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p class="text-sm text-amber-800">报警时请清晰说明：<br>• 具体位置（校区、楼栋、楼层）<br>• 患者当前状态<br>• 联系电话保持畅通</p>
                </div>
            </div>

            <button onclick="closeEmergencyModal()" class="w-full mt-4 py-3 text-gray-500 font-medium card-press">
                取消
            </button>
        </div>
    </div>

    <!-- 照片查看器弹窗 -->
    <div id="photo-viewer-modal" class="fixed inset-0 bg-black/90 z-[60] hidden flex items-center justify-center">
        <button onclick="closePhotoViewer()" class="absolute top-4 right-4 w-12 h-12 bg-white/20 hover:bg-white/30 text-white rounded-full flex items-center justify-center card-press transition-colors z-10">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
        <img id="photo-viewer-img" src="" alt="现场照片" class="max-w-[90%] max-h-[90%] object-contain rounded-lg shadow-2xl">
    </div>

    <!-- 标注输入对话框 -->
    <div id="marker-input-modal" class="fixed inset-0 bg-black/60 z-[70] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl modal-enter shadow-2xl max-h-[80vh] overflow-y-auto">
            <div class="p-5">
                <h3 class="text-lg font-bold text-gray-800 mb-4">添加标注</h3>
                
                <div class="flex gap-2 mb-4">
                    <button onclick="setMarkerType('normal')" id="marker-type-normal" class="flex-1 py-2 px-3 bg-red-50 text-red-600 rounded-lg font-medium card-press border border-red-200">普通标注</button>
                    <button onclick="setMarkerType('aed')" id="marker-type-aed" class="flex-1 py-2 px-3 bg-gray-50 text-gray-500 rounded-lg font-medium card-press border border-gray-200">新增AED</button>
                </div>
                
                <input type="text" id="marker-input" placeholder="请输入标注内容" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent text-gray-700 mb-3" maxlength="50">
                
                <div id="aed-fields" class="hidden space-y-3">
                    <input type="text" id="aed-address" placeholder="详细地址（如：XX楼-1楼-大厅）" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent text-gray-700" maxlength="100">
                    <input type="text" id="aed-desc" placeholder="设备描述（如：红色AED标识盒内）" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent text-gray-700" maxlength="100">
                    
                    <div>
                        <label class="block text-sm text-gray-500 mb-2">现场照片（可选）</label>
                        <div id="aed-photo-preview" class="hidden relative rounded-xl overflow-hidden mb-2">
                            <img id="aed-photo-img" src="" class="w-full h-auto max-h-[150px] object-cover">
                            <button onclick="removeAEDPhoto()" class="absolute top-2 right-2 w-8 h-8 bg-black/60 hover:bg-black/80 text-white rounded-full flex items-center justify-center card-press transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                        <label for="aed-photo-input" class="flex items-center justify-center gap-2 w-full py-3 border-2 border-dashed border-gray-200 rounded-xl text-gray-500 hover:border-red-300 hover:text-red-500 transition-colors card-press cursor-pointer">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <span>点击上传照片</span>
                        </label>
                        <input type="file" id="aed-photo-input" accept="image/*" class="hidden" onchange="handleAEDPhotoUpload(this)">
                    </div>
                </div>
            </div>
            <div class="flex border-t border-gray-100">
                <button onclick="cancelMarkerInput()" class="flex-1 py-3 text-gray-600 font-medium card-press">取消标注</button>
                <div class="w-px bg-gray-100"></div>
                <button onclick="confirmMarkerInput()" class="flex-1 py-3 text-red-600 font-bold card-press">确认添加</button>
            </div>
        </div>
    </div>

    <!-- 定位权限拒绝提示 -->
    <div id="location-denied" class="fixed top-20 left-4 right-4 bg-amber-50 border border-amber-200 rounded-xl p-4 z-40 hidden shadow-lg">
        <div class="flex items-start gap-2">
            <svg class="w-5 h-5 text-amber-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <div class="flex-1">
                <p class="text-sm text-amber-800 font-medium">无法获取您的位置</p>
                <p class="text-xs text-amber-700 mt-1">请允许定位权限，或手动在地图上点击选择您的位置</p>
                <button onclick="enableManualSelect()" class="mt-2 text-xs bg-amber-200 text-amber-800 px-3 py-1.5 rounded-lg font-medium">手动选择位置</button>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <nav id="bottom-nav" class="bottom-nav glass-effect border-t border-white/20 px-4 py-3 z-40">
        <div class="flex justify-around items-center max-w-lg mx-auto">
            <button onclick="switchTab('map')" id="nav-map" class="nav-btn flex flex-col items-center gap-1 py-2 px-5 rounded-xl transition-all nav-active">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-2.761 0-5 2.239-5 5s2.239 5 5 5 5-2.239 5-5-2.239-5-5-5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
                </svg>
                <span class="text-xs font-bold">AED地图</span>
            </button>
            
            <button onclick="switchTab('knowledge')" id="nav-knowledge" class="nav-btn flex flex-col items-center gap-1 py-2 px-5 rounded-xl transition-all text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
                <span class="text-xs font-bold">急救知识</span>
            </button>

            <button onclick="toggleAddMarkerMode()" id="nav-add-marker" class="nav-btn flex flex-col items-center gap-1 py-2 px-5 rounded-xl transition-all text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span class="text-xs font-bold">添加标注</span>
            </button>

            <button onclick="openEmergencyModal()" id="nav-emergency" class="flex flex-col items-center -mt-8">
                <div class="emergency-btn w-18 h-18 bg-gradient-to-br from-emergency to-red-500 rounded-full shadow-2xl shadow-red-300 flex items-center justify-center border-4 border-white card-press">
                    <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                </div>
                <span class="text-xs font-black text-emergency mt-2">紧急呼叫</span>
            </button>
        </div>
    </nav>

    <!-- 定位权限拒绝提示 -->
    <div id="location-denied" class="fixed top-20 left-4 right-4 bg-amber-50 border border-amber-200 rounded-xl p-4 z-40 hidden shadow-lg">
        <div class="flex items-start gap-2">
            <svg class="w-5 h-5 text-amber-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>

function initMap() {
    map = new TMap.Map('map', {
        center: new TMap.LatLng(CAMPUS_CENTER[0], CAMPUS_CENTER[1]),
        zoom: 16

        renderCustomMarkers();
        fitMapToCampus();
    }, 300);
}

function fitMapToCampus() {
    let minLat = Infinity, maxLat = -Infinity;
    let minLng = Infinity, maxLng = -Infinity;

    AED_DATA.features.forEach(feature => {
        const [lng, lat] = feature.geometry.coordinates;
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
        minLng = Math.min(minLng, lng);
        maxLng = Math.max(maxLng, lng);
    });

    BUILDING_DATA.forEach(building => {
        const [lng, lat] = building.coordinates;
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
        minLng = Math.min(minLng, lng);
        maxLng = Math.max(maxLng, lng);
    });

    customAEDData.forEach(feature => {
        const [lng, lat] = feature.geometry.coordinates;
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
        minLng = Math.min(minLng, lng);
        maxLng = Math.max(maxLng, lng);
    });

    const padding = 0.002;
    const bounds = new TMap.LatLngBounds(
        new TMap.LatLng(minLat - padding, minLng - padding),
        new TMap.LatLng(maxLat + padding, maxLng + padding)
    );

    map.setViewport({ bounds: bounds });
    map.setMaxBounds(bounds);
}

        function renderBuildingLabels() {
    if (buildingLabels) {
        buildingLabels.setMap(null);
        buildingLabels = null;
    }

    const geometries = BUILDING_DATA.map(building => ({
        id: building.id,
        position: new TMap.LatLng(building.coordinates[1], building.coordinates[0]),
        content: building.name,
        properties: building
    }));

    buildingLabels = new TMap.MultiLabel({
        map: map,
        styles: {
            'building': new TMap.LabelStyle({
                color: '#333333',
                fontSize: 12,
                fontFamily: 'Microsoft YaHei, sans-serif',
                strokeColor: '#ffffff',
                strokeWidth: 2,
                offset: { x: 0, y: -20 },
                anchor: { x: 0.5, y: 0.5 }
            })
        },
        geometries: geometries.map(g => ({ ...g, styleId: 'building' }))
    });
}

        function renderAEDMarkers() {
    if (aedMarkers.length > 0) {
        aedMarkers.forEach(m => m.setMap(null));
        aedMarkers = [];
    }

    const builtInGeometries = AED_DATA.features.map(feature => {
        const coords = feature.geometry.coordinates;
        return {
            id: feature.properties.id,
            position: new TMap.LatLng(coords[1], coords[0]),
            properties: feature.properties
        };
    });

    const customGeometries = customAEDData.map(feature => {
        const coords = feature.geometry.coordinates;
        return {
            id: feature.properties.id,
            position: new TMap.LatLng(coords[1], coords[0]),
            properties: feature.properties
        };
    });

    const geometries = [...builtInGeometries, ...customGeometries];

    const aedIcon = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgdmlld0JveD0iMCAwIDIwIDIwIj48Y2lyY2xlIGN4PSIxMCIgY3k9IjEwIiByPSI3IiBmaWxsPSIjMDA4NGNmIi8+PC9zdmc+';
    const markerLayer = new TMap.MultiMarker({
        map: map,
        styles: {
            'aed': new TMap.MarkerStyle({
                width: 18,
                height: 18,
                anchor: { x: 9, y: 9 },
                src: aedIcon
            })
        },
        geometries: geometries.map(g => ({ ...g, styleId: 'aed' }))
    });

    markerLayer.on('click', (e) => {
        if (e.geometry && e.geometry.properties) {
            openAEDModal(e.geometry.properties);
        }
    });
    
    markerLayer.on('touchstart', (e) => {
        if (e.geometry && e.geometry.properties) {
            openAEDModal(e.geometry.properties);
        }
    });

    aedMarkers.push(markerLayer);

function calculateDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLng/2) * Math.sin(dLng/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function findNearestAED() {
    if (!userLocation || !Array.isArray(userLocation) || userLocation.length !== 2) {
        return null;
    }

    let nearest = null;
    let minDistance = Infinity;

    AED_DATA.features.forEach(feature => {
        const [lng, lat] = feature.geometry.coordinates;
        const distance = calculateDistance(userLocation[0], userLocation[1], lat, lng);
        if (distance < minDistance) {
            minDistance = distance;
            nearest = {
                ...feature.properties,
                coordinates: [lng, lat],
                distance: Math.round(distance)
            };
        }
    });

    return nearest;
}

}

function handleAEDPhotoUpload(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxWidth = 800;
            const maxHeight = 800;
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
                height = (height * maxWidth) / width;
                width = maxWidth;
            }
            if (height > maxHeight) {
                width = (width * maxHeight) / height;
                height = maxHeight;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            pendingAEDPhoto = canvas.toDataURL('image/jpeg', 0.7);
            
            const preview = document.getElementById('aed-photo-preview');
            const previewImg = document.getElementById('aed-photo-img');
            previewImg.src = pendingAEDPhoto;
            preview.classList.remove('hidden');
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

     // WGS84 转 GCJ02 本地算法（中国大陆通用）
// 误差<1米，无网络请求，无跨域，离线可用
function convertWgs84ToGcj02(lat, lon) {
    // 中国坐标范围判断（国外坐标不转换）
    if (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271) {
        return [lat, lon];
    }

    const a = 6378245.0; // 地球长半轴
    const ee = 0.00669342162296594323; // 偏心率平方
    const pi = 3.14159265358979324;

    function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * pi) + 20.0 * Math.sin(2.0 * x * pi)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * pi) + 40.0 * Math.sin(y / 3.0 * pi)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * pi) + 320 * Math.sin(y * pi / 30.0)) * 2.0 / 3.0;
        return ret;
    }

    function transformLon(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * pi) + 20.0 * Math.sin(2.0 * x * pi)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * pi) + 40.0 * Math.sin(x / 3.0 * pi)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * pi) + 300.0 * Math.sin(x / 30.0 * pi)) * 2.0 / 3.0;
        return ret;
    }

    let dLat = transformLat(lon - 105.0, lat - 35.0);
    let dLon = transformLon(lon - 105.0, lat - 35.0);
    let radLat = lat / 180.0 * pi;
    let magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    let sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * pi);
    dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * pi);
    
    return [lat + dLat, lon + dLon];
}

                    <div class="flex items-start gap-2">
                        <svg class="w-5 h-5 text-amber-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p class="text-sm text-amber-800"><strong>注意：</strong>以上为现场急救指引，不能替代专业医疗救治。实施急救的同时请务必拨打120急救电话。</p>
                    </div>
                </div>
            `;

            document.getElementById('knowledge-detail-page').classList.remove('page-hidden');
        }

        function closeKnowledgeDetail() {
            document.getElementById('knowledge-detail-page').classList.add('page-hidden');
        }

        // ========== 紧急呼叫 ==========
        function openEmergencyModal() {
            document.getElementById('emergency-modal').classList.remove('hidden');
        }

        function closeEmergencyModal() {
            document.getElementById('emergency-modal').classList.add('hidden');
        }

        function callNumber(number) {
            window.location.href = `tel:${number}`;
        }

        function callHospital() {
            const phone = document.getElementById('hospital-phone').textContent;
            callNumber(phone);
        }

        // ========== 工具函数 ==========
        function hideLoading() {
            const loading = document.getElementById('loading-screen');
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.2s';
            setTimeout(() => loading.classList.add('hidden'), 200);
        }

        function showLocationDenied() {
            setTimeout(() => {
                document.getElementById('location-denied').classList.remove('hidden');
            }, 2000);
        }

        // 点击遮罩关闭弹窗
        document.getElementById('aed-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('aed-modal')) closeAEDModal();
        });

        document.getElementById('emergency-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('emergency-modal')) closeEmergencyModal();
        });

        // 防止底部导航点击穿透
        document.getElementById('bottom-nav').addEventListener('touchstart', (e) => {
            e.stopPropagation();
        }, { passive: true });
    </script>
</body>
</html>
