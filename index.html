

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>校园应急救护系统</title>
<!-- 新版 GL JS API -->
<script src="https://map.qq.com/api/gljs?v=1.exp&key=6WOBZ-EEELQ-VSD5J-BQPIQ-Q2HQ6-AWFQN"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emergency: '#E53935',
                        'emergency-dark': '#C62828',
                        'emergency-light': '#FFEBEE',
                        medical: '#00897B',
                        'medical-light': '#E0F2F1'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        
        * {
            font-family: 'Noto Sans SC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        #map {
            z-index: 1;
            touch-action: manipulation;
            user-select: none;
        }
        
        body {
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        
        .bottom-nav {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .emergency-btn {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(229, 57, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); }
        }
        
        @keyframes float-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .card-press {
            transition: all 0.2s ease;
        }
        
        .card-press:active {
            transform: scale(0.96);
        }
        
        .modal-enter {
            animation: slide-up 0.3s ease-out;
        }
        
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(229, 57, 53, 0.1);
            border-top-color: #E53935;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(229, 57, 53, 0.3);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .knowledge-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .cpr-card { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .heimlich-card { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .bleeding-card { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .heatstroke-card { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .fracture-card { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .nosebleed-card { background: linear-gradient(135deg, #e66465 0%, #9198e5 100%); }
        .sprain-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .burn-card { background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%); }
        .faint-card { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .seizure-card { background: linear-gradient(135deg, #c471f5 0%, #fa71cd 100%); }
        .hypoglycemia-card { background: linear-gradient(135deg, #f5af19 0%, #f12711 100%); }
        .allergy-card { background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%); }
        .drowning-card { background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); }
        .shock-card { background: linear-gradient(135deg, #8e9eab 0%, #eef2f3 100%); }
        .eye-card { background: linear-gradient(135deg, #667eea 0%, #a18cd1 100%); }
        
        .page-hidden {
            display: none;
        }
        
        .tab-active {
            color: #E53935;
        }
        
        .detail-slide {
            animation: slide-in-right 0.3s ease-out;
        }
        
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .text-gradient {
            background: linear-gradient(135deg, #E53935 0%, #FF5252 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .shadow-glow {
            box-shadow: 0 4px 20px rgba(229, 57, 53, 0.15);
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #E53935 0%, #FF5252 100%);
        }
        
        .nav-active {
            background: rgba(229, 57, 53, 0.1);
            color: #E53935;
        }
        
        /* AI智能体聊天样式 */
        .chat-container { display: flex; flex-direction: column; height: 100%; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .chat-bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; word-break: break-word; animation: fade-in 0.3s ease; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .chat-bubble.user { align-self: flex-end; background: linear-gradient(135deg, #E53935, #FF5252); color: white; border-bottom-right-radius: 4px; }
        .chat-bubble.ai { align-self: flex-start; background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 4px; }
        .chat-bubble.ai .quick-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .quick-action-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; background: white; border: 1px solid #e2e8f0; border-radius: 20px; font-size: 12px; font-weight: 600; color: #E53935; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .quick-action-btn:hover { background: #fef2f2; border-color: #fca5a5; }
        .quick-action-btn:active { transform: scale(0.95); }
        .chat-typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 16px; background: #f1f5f9; border-radius: 16px; border-bottom-left-radius: 4px; }
        .typing-dot { width: 8px; height: 8px; background: #94a3b8; border-radius: 50%; animation: typing-bounce 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing-bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
        .chat-input-area { padding: 12px 16px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; align-items: flex-end; }
        .chat-input { flex: 1; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 24px; font-size: 15px; outline: none; resize: none; min-height: 44px; max-height: 120px; line-height: 1.5; transition: border-color 0.2s; }
        .chat-input:focus { border-color: #E53935; }
        .chat-send-btn { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #E53935, #FF5252); color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; box-shadow: 0 4px 12px rgba(229, 57, 53, 0.3); }
        .chat-send-btn:active { transform: scale(0.9); }
        .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-stop-btn { width: 36px; height: 36px; border-radius: 50%; background: #ef4444; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; animation: pulse-stop 1.5s infinite; }
        @keyframes pulse-stop { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); } 50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); } }
        .markdown-body { font-size: 14px; line-height: 1.7; }
        .markdown-body p { margin: 0 0 8px 0; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body ul, .markdown-body ol { margin: 4px 0; padding-left: 20px; }
        .markdown-body li { margin: 2px 0; }
        .markdown-body code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .markdown-body pre { background: #1e293b; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
        .markdown-body pre code { background: none; padding: 0; color: inherit; }
        .markdown-body strong { font-weight: 700; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin: 12px 0 6px 0; font-weight: 700; }
        .markdown-body h1 { font-size: 1.2em; }
        .markdown-body h2 { font-size: 1.1em; }
        .markdown-body h3 { font-size: 1em; }
        .markdown-body blockquote { border-left: 3px solid #e53935; padding-left: 12px; margin: 8px 0; color: #64748b; }
        .ai-welcome { text-align: center; padding: 40px 20px; }
        .ai-welcome-icon { width: 72px; height: 72px; margin: 0 auto 16px; background: linear-gradient(135deg, #E53935, #FF5252); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(229, 57, 53, 0.25); }
        .suggested-questions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
        .suggested-chip { padding: 8px 16px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 20px; font-size: 13px; color: #E53935; cursor: pointer; transition: all 0.2s; }
        .suggested-chip:hover { background: #fee2e2; }
        .suggested-chip:active { transform: scale(0.95); }
        #map { z-index: 1; touch-action: manipulation; user-select: none; width: 100%; height: 100%; min-height: 400px; }
        #main-content { min-height: 0; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col overflow-hidden">

    <!-- 加载界面 -->
    <div id="loading-screen" class="fixed inset-0 bg-gradient-to-br from-gray-50 via-white to-red-50 z-50 flex flex-col items-center justify-center">
        <div class="relative mb-6">
            <div class="loading-spinner"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <svg class="w-8 h-8 text-emergency" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                </svg>
            </div>
        </div>
        <div class="text-xl font-black text-gradient mb-2">校园应急救护</div>
        <div class="text-sm text-gray-500 font-medium">正在获取您的位置信息...</div>
        <div class="mt-8 flex items-center gap-1">
            <div class="w-2 h-2 bg-emergency rounded-full animate-bounce" style="animation-delay: 0ms"></div>
            <div class="w-2 h-2 bg-emergency rounded-full animate-bounce" style="animation-delay: 150ms"></div>
            <div class="w-2 h-2 bg-emergency rounded-full animate-bounce" style="animation-delay: 300ms"></div>
        </div>
    </div>

    <!-- 顶部标题栏 -->
    <header id="main-header" class="glass-effect shadow-sm z-40 px-4 py-3 flex items-center justify-between border-b border-white/20">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-emergency to-red-400 rounded-xl flex items-center justify-center shadow-lg shadow-red-200">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-black text-gradient leading-tight">校园应急救护</h1>
                <p class="text-xs text-gray-500 font-medium" id="header-subtitle">保护生命，分秒必争</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div id="location-status" class="flex items-center gap-2 text-xs bg-gray-100/80 px-3 py-1.5 rounded-full backdrop-blur-sm">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-gray-700 font-medium">定位中</span>
            </div>
            <button onclick="navigateToNearestAED()" class="bg-emergency text-white px-4 py-2 rounded-full text-sm font-bold card-press shadow-lg flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                导航最近
            </button>
        </div>
    </header>

    <!-- 主内容区 -->
    <main id="main-content" class="flex-1 overflow-hidden relative">
        
        <!-- 地图页 -->
        <div id="map-page" class="absolute inset-0 bg-gray-100 overflow-hidden">
            <div id="map" class="w-full h-full"></div>
        </div>

        <!-- 急救知识页 -->
        <div id="knowledge-page" class="absolute inset-0 bg-gray-50 overflow-y-auto page-hidden pb-20">
            <div class="p-4">
                <h2 class="text-xl font-black mb-1">急救知识</h2>
                <p class="text-sm text-gray-500 mb-4">关键时刻能救命的基础急救技能</p>

                <div class="relative mb-4"><input type="text" id="knowledge-search" placeholder="搜索急救知识..." class="w-full px-4 py-3 pl-10 bg-white border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-emergency transition-colors" oninput="searchKnowledge()"><svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></div>
                
                <div id="knowledge-cards" class="grid grid-cols-1 gap-4">
                    <!-- 动态生成卡片 -->
                </div>
            </div>
        </div>

        <!-- 急救知识详情页 -->
        <div id="knowledge-detail-page" class="absolute inset-0 bg-white overflow-y-auto page-hidden z-30">
            <div class="sticky top-0 bg-white z-10 px-4 py-3 flex items-center gap-3 shadow-sm">
                <button onclick="closeKnowledgeDetail()" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="text-lg font-bold" id="detail-title">详情</div>
            </div>
            <div id="detail-content" class="p-4 pb-20">
                <!-- 动态生成内容 -->
            </div>
        </div>

        <!-- AI智能体页 -->
        <div id="ai-page" class="absolute inset-0 bg-white overflow-hidden page-hidden" style="display:none">
            <div class="sticky top-0 bg-white z-10 px-4 py-3 flex items-center justify-between shadow-sm border-b border-gray-100">
                <h3 class="text-base font-black text-gray-800">AI急救顾问</h3>
                <button onclick="newConversation()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-full font-medium transition-colors">+ 新对话</button>
            </div>
            <div id="ai-chat-messages" class="chat-messages">
                <div class="ai-welcome">
                    <div class="ai-welcome-icon">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                    </div>
                    <h3 class="text-lg font-black text-gray-800 mb-1">AI急救顾问</h3>
                    <p class="text-sm text-gray-500">基于专业知识库，为您提供急救指导</p>
                    <div class="suggested-questions">
                        <span class="suggested-chip" data-question="有人突然倒地不醒，我该怎么办？">有人倒地不醒怎么办？</span>
                        <span class="suggested-chip" data-question="如何进行心肺复苏？">如何进行心肺复苏？</span>
                        <span class="suggested-chip" data-question="吃东西噎住了怎么处理？">吃东西噎住了怎么办？</span>
                        <span class="suggested-chip" data-question="有人中暑了应该怎么做？">有人中暑了怎么做？</span>
                    </div>
                </div>
            </div>
            <div class="chat-input-area">
                <button id="ai-stop-btn" class="chat-stop-btn" onclick="stopConversation()" style="display:none" title="停止生成"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
                <textarea id="ai-chat-input" class="chat-input" placeholder="请描述您遇到的紧急情况..." rows="1" onkeydown="handleChatKey(event)"></textarea>
                <button id="ai-send-btn" class="chat-send-btn" onclick="sendMessage()"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg></button>
            </div>
        </div>
    </main>

    <!-- AED详情弹窗 -->
    <div id="aed-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end">
        <div class="bg-white w-full rounded-t-3xl max-h-[85vh] overflow-y-auto modal-enter shadow-2xl">
            <div class="sticky top-0 bg-white px-5 py-4 border-b border-gray-100 flex items-center justify-between z-10">
                <h3 class="text-lg font-black text-gray-800">AED设备详情</h3>
                <button onclick="closeAEDModal()" class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center card-press">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <div id="aed-modal-content" class="p-5">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>

    <!-- 紧急呼叫面板 -->
    <div id="emergency-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end">
        <div class="bg-white w-full rounded-t-3xl p-6 modal-enter">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
            <h2 class="text-2xl font-black text-center mb-2 text-emergency">紧急呼叫</h2>
            <p class="text-center text-gray-500 text-sm mb-6">请保持冷静，准确说明事发地点和情况</p>
            
            <div class="space-y-4">
                <button onclick="callNumber('120')" class="w-full bg-emergency hover:bg-emergency-dark text-white py-5 rounded-2xl shadow-xl card-press flex items-center justify-center gap-3">
                    <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                        </svg>
                    </div>
                    <div class="text-left">
                        <div class="text-2xl font-black">拨打 120</div>
                        <div class="text-sm text-white/80">急救中心</div>
                    </div>
                </button>

                <button onclick="callHospital()" class="w-full bg-medical hover:bg-teal-700 text-white py-5 rounded-2xl shadow-xl card-press flex items-center justify-center gap-3">
                    <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                    </div>
                    <div class="text-left">
                        <div class="text-2xl font-black" id="hospital-phone">010-12345678</div>
                        <div class="text-sm text-white/80" id="hospital-label">校医院 · 本部校区</div>
                    </div>
                </button>
            </div>
            <div class="mt-6 bg-amber-50 border border-amber-200 rounded-xl p-4">
                <div class="flex items-start gap-2">
                    <svg class="w-5 h-5 text-amber-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p class="text-sm text-amber-800">报警时请清晰说明：<br>• 具体位置（校区、楼栋、楼层）<br>• 患者当前状态<br>• 联系电话保持畅通</p>
                </div>
            </div>

            <button onclick="closeEmergencyModal()" class="w-full mt-4 py-3 text-gray-500 font-medium card-press">
                取消
            </button>
        </div>

function initMap() {

// 图标点击识别：直接在 #map 上监听原生触摸与点击，按坐标命中最近的 AED 图标，
// 不依赖地图 SDK 的图标事件（部分手机浏览器/内置浏览器收不到这些事件）
function bindMapTapFallback() {
    const mapEl = document.getElementById('map');
    if (!mapEl || mapEl.dataset.aedTapBound === '1') return;
    mapEl.dataset.aedTapBound = '1';

    let touchStart = null;
    let mouseStart = null;

    // 找出点击位置附近（26px 内）最近的 AED
    const hitTestAED = (clientX, clientY) => {
        const rect = mapEl.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        let best = null;
        AED_DATA.features.forEach((feature) => {
            const [lng, lat] = feature.geometry.coordinates;
            const p = map.projectToContainer(new TMap.LatLng(lat, lng));
            const d = Math.hypot(p.getX() - x, p.getY() - y);
            if (d <= 26 && (!best || d < best.d)) best = { d: d, props: feature.properties };
        });
        return best ? best.props : null;
    };

    const openAEDAt = (clientX, clientY, fromTouch) => {
        if (manualMode) return;

        // 点到缩放按钮、比例尺等地图控件时不要误弹详情
        const topEl = document.elementFromPoint(clientX, clientY);
        if (!topEl || !mapEl.contains(topEl)) return;
        const topRect = topEl.getBoundingClientRect();
        const mapRect = mapEl.getBoundingClientRect();
        if (topRect.width < mapRect.width * 0.8 || topRect.height < mapRect.height * 0.8) return;

        const props = hitTestAED(clientX, clientY);
        if (!props) return;

        const now = Date.now();
        if (props.id === aedTapLockId && now - aedTapLockAt < 800) return;
        aedTapLockId = props.id;
        aedTapLockAt = now;
        if (fromTouch) aedSwallowClickUntil = now + 400;

        openAEDModal(props);
    };

    mapEl.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true, capture: true });

    mapEl.addEventListener('touchcancel', () => { touchStart = null; }, { passive: true, capture: true });

    mapEl.addEventListener('touchend', (e) => {
        if (!touchStart) return;
        const t = e.changedTouches[0];
        const moved = Math.hypot(t.clientX - touchStart.x, t.clientY - touchStart.y);
        touchStart = null;
        // 只有滑动地图不算点击；手指停留时间长一点也仍然算点击（照顾慢速点击）
        if (moved <= 12) openAEDAt(t.clientX, t.clientY, true);
    }, { passive: true, capture: true });

    mapEl.addEventListener('mousedown', (e) => {
        mouseStart = { x: e.clientX, y: e.clientY };
    }, true);

    mapEl.addEventListener('click', (e) => {
        const moved = mouseStart ? Math.hypot(e.clientX - mouseStart.x, e.clientY - mouseStart.y) : 0;
        mouseStart = null;
        if (moved <= 12) openAEDAt(e.clientX, e.clientY, false);
    }, true);
}

function fitMapToCampus() {
    let minLat = Infinity, maxLat = -Infinity;
    let minLng = Infinity, maxLng = -Infinity;

    AED_DATA.features.forEach(feature => {
        const [lng, lat] = feature.geometry.coordinates;
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
        minLng = Math.min(minLng, lng);
        maxLng = Math.max(maxLng, lng);
    });

    BUILDING_DATA.forEach(building => {
        const [lng, lat] = building.coordinates;
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
        minLng = Math.min(minLng, lng);
        maxLng = Math.max(maxLng, lng);
    });

    const padding = 0.002;
    const bounds = new TMap.LatLngBounds(
        new TMap.LatLng(minLat - padding, minLng - padding),
        new TMap.LatLng(maxLat + padding, maxLng + padding)
    );

    map.setViewport({ bounds: bounds });
    map.setMaxBounds(bounds);
}

function calculateDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLng/2) * Math.sin(dLng/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function findNearestAED() {
    if (!userLocation || !Array.isArray(userLocation) || userLocation.length !== 2) {
        return null;
    }

    let nearest = null;
    let minDistance = Infinity;

    AED_DATA.features.forEach(feature => {
        const [lng, lat] = feature.geometry.coordinates;
        const distance = calculateDistance(userLocation[0], userLocation[1], lat, lng);
        if (distance < minDistance) {
            minDistance = distance;
            nearest = {
                ...feature.properties,
                coordinates: [lng, lat],
                distance: Math.round(distance)
            };
        }
    });

    return nearest;
}

function navigateToNearestAED() {

}

     // WGS84 转 GCJ02 本地算法（中国大陆通用）
// 误差<1米，无网络请求，无跨域，离线可用
function convertWgs84ToGcj02(lat, lon) {
    // 中国坐标范围判断（国外坐标不转换）
    if (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271) {
        return [lat, lon];
    }

    const a = 6378245.0; // 地球长半轴
    const ee = 0.00669342162296594323; // 偏心率平方
    const pi = 3.14159265358979324;

    function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * pi) + 20.0 * Math.sin(2.0 * x * pi)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * pi) + 40.0 * Math.sin(y / 3.0 * pi)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * pi) + 320 * Math.sin(y * pi / 30.0)) * 2.0 / 3.0;
        return ret;
    }

    function transformLon(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * pi) + 20.0 * Math.sin(2.0 * x * pi)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * pi) + 40.0 * Math.sin(x / 3.0 * pi)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * pi) + 300.0 * Math.sin(x / 30.0 * pi)) * 2.0 / 3.0;
        return ret;
    }

    let dLat = transformLat(lon - 105.0, lat - 35.0);
    let dLon = transformLon(lon - 105.0, lat - 35.0);
    let radLat = lat / 180.0 * pi;
    let magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    let sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * pi);
    dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * pi);
    
    return [lat + dLat, lon + dLon];
}

                            <p class="text-sm text-gray-600 leading-relaxed pl-11">${step.desc}</p>
                        </div>
                    `).join('')}
                </div>
                <div class="mt-6 bg-amber-50 border border-amber-200 rounded-xl p-4">
                    <div class="flex items-start gap-2">
                        <svg class="w-5 h-5 text-amber-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p class="text-sm text-amber-800"><strong>注意：</strong>以上为现场急救指引，不能替代专业医疗救治。实施急救的同时请务必拨打120急救电话。</p>
                    </div>
                </div>
            `;

            document.getElementById('knowledge-detail-page').classList.remove('page-hidden');
        }

        function closeKnowledgeDetail() {
            document.getElementById('knowledge-detail-page').classList.add('page-hidden');
        }

        // ========== 紧急呼叫 ==========
        function openEmergencyModal() {
            document.getElementById('emergency-modal').classList.remove('hidden');
        }

        function closeEmergencyModal() {
            document.getElementById('emergency-modal').classList.add('hidden');
        }

        function callNumber(number) {
            window.location.href = `tel:${number}`;
        }

        function callHospital() {
            const phone = document.getElementById('hospital-phone').textContent;
            callNumber(phone);
        }

        // ========== 工具函数 ==========
        function hideLoading() {
            const loading = document.getElementById('loading-screen');
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.2s';
            setTimeout(() => loading.classList.add('hidden'), 200);
        }

        function showLocationDenied() {
            setTimeout(() => {
                document.getElementById('location-denied').classList.remove('hidden');
            }, 2000);
        }

        // 点击遮罩关闭弹窗
        // 只有“按下位置就是遮罩”的点击才关闭，避免地图上触摸弹窗后补发的 click 把弹窗瞬间关掉
        const aedModalEl = document.getElementById('aed-modal');
        let aedBackdropPressed = false;

        const markAedBackdropPress = (e) => {
            aedBackdropPressed = (e.target === aedModalEl);
        };

        aedModalEl.addEventListener('touchstart', markAedBackdropPress, { passive: true });
        aedModalEl.addEventListener('mousedown', markAedBackdropPress);
        aedModalEl.addEventListener('click', (e) => {
            // 触摸打开弹窗后补发的 click 直接忽略，避免误触面板上的按钮
            if (Date.now() < aedSwallowClickUntil) {
                aedSwallowClickUntil = 0;
                e.stopPropagation();
                e.preventDefault();
                return;
            }
            if (aedBackdropPressed && e.target === aedModalEl) closeAEDModal();
            aedBackdropPressed = false;
        }, true);

        document.getElementById('emergency-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('emergency-modal')) closeEmergencyModal();
        });

        document.getElementById('image-viewer-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('image-viewer-modal')) closeImageViewer();
        });

        // 从后台（例如跳转腾讯地图后返回）恢复时重新计算地图尺寸，避免画布点击区域错位
        document.addEventListener('visibilitychange', () => {
            if (document.hidden || !map) return;
            const mapPage = document.getElementById('map-page');
            if (!mapPage.classList.contains('page-hidden')) map.resize();
        });

        // 防止底部导航点击穿透
        document.getElementById('bottom-nav').addEventListener('touchstart', (e) => {
            e.stopPropagation();
        }, { passive: true });
    </script>
    <script src="ai-agent.js"></script>
</body>
</html>
