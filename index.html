
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>校园应急救护系统</title>
<!-- 新版 GL JS API -->
<script src="https://map.qq.com/api/gljs?v=1.exp&key=6WOBZ-EEELQ-VSD5J-BQPIQ-Q2HQ6-AWFQN"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emergency: '#E53935',
                        'emergency-dark': '#C62828',
                        'emergency-light': '#FFEBEE',
                        medical: '#00897B',
                        'medical-light': '#E0F2F1'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        
        * {
            font-family: 'Noto Sans SC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        
        #map {
            z-index: 1;
        }
        
        .bottom-nav {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .emergency-btn {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(229, 57, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); }
        }
        
        .nearest-float {
            animation: float-up 0.5s ease-out;
        }
        
        @keyframes float-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .card-press {
            transition: transform 0.2s;
        }
        
        .card-press:active {
            transform: scale(0.98);
        }
        
        .modal-enter {
            animation: slide-up 0.3s ease-out;
        }
        
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #E53935;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .knowledge-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .cpr-card { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .heimlich-card { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .bleeding-card { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .heatstroke-card { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .fracture-card { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        
        .page-hidden {
            display: none;
        }
        
        .tab-active {
            color: #E53935;
        }
        
        .detail-slide {
            animation: slide-in-right 0.3s ease-out;
        }
        
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col overflow-hidden">

    <!-- 加载界面 -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div class="loading-spinner mb-4"></div>
        <div class="text-lg font-bold text-gray-800">正在加载校园应急救护系统</div>
        <div class="text-sm text-gray-500 mt-2">正在获取您的位置信息...</div>
    </div>

    <!-- 顶部标题栏 -->
    <header id="main-header" class="bg-white shadow-sm z-40 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-emergency rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold leading-tight">校园应急救护</h1>
                <p class="text-xs text-gray-500" id="header-subtitle">保护生命，分秒必争</p>
            </div>
        </div>
        <div id="location-status" class="flex items-center gap-1 text-xs bg-gray-100 px-2 py-1 rounded-full">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            <span>定位中</span>
        </div>
    </header>

    <!-- 主内容区 -->
    <main id="main-content" class="flex-1 overflow-hidden relative">
        
        <!-- 地图页 -->
        <div id="map-page" class="absolute inset-0 bg-gray-100">
            <div id="map" class="w-full h-full"></div>
            
            <!-- 最近AED推荐浮窗 -->
            <div id="nearest-aed-panel" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-2xl z-30 nearest-float hidden">
                <div class="p-4">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="px-2 py-1 bg-emergency-light text-emergency text-xs font-bold rounded-full">最近AED</span>
                        <span id="nearest-distance" class="text-2xl font-black text-emergency">--</span>
                        <span class="text-gray-600 text-sm">米 · 步行约</span>
                        <span id="nearest-time" class="text-lg font-bold text-emergency">--</span>
                        <span class="text-gray-600 text-sm">分钟</span>
                    </div>
                    
                    <div class="mb-3">
                        <div id="nearest-name" class="text-base font-bold text-gray-800">--</div>
                        <div id="nearest-address" class="text-sm text-gray-500 mt-1">--</div>
                    </div>
                    
                    <div class="flex gap-3">
                        <button onclick="viewNearestDetail()" class="flex-1 py-3 border-2 border-emergency text-emergency font-bold rounded-xl card-press text-base">
                            查看详情
                        </button>
                        <button onclick="navigateToNearest()" class="flex-1 py-3 bg-emergency text-white font-bold rounded-xl shadow-lg shadow-red-200 card-press text-base flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 7m0 13V7"/>
                            </svg>
                            一键导航至此
                        </button>
                    </div>
                </div>
            </div>

            <!-- 地图控制按钮 -->
            <div class="absolute top-4 right-4 z-20 flex flex-col gap-2">
                <button onclick="centerOnUser()" class="w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center card-press">
                    <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-2.761 0-5 2.239-5 5s2.239 5 5 5 5-2.239 5-5-2.239-5-5-5z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
                    </svg>
                </button>
                <button onclick="toggleLayer()" id="layer-btn" class="w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center card-press">
                    <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                    </svg>
                </button>
            </div>

            <!-- 图层切换面板 -->
            <div id="layer-panel" class="absolute top-20 right-4 z-20 bg-white rounded-xl shadow-xl p-3 hidden">
                <div class="text-sm font-bold text-gray-700 mb-2">地图图层</div>
                <label class="flex items-center gap-2 py-2 px-3 cursor-pointer hover:bg-gray-50 rounded-lg">
                    <input type="checkbox" id="layer-aed" checked onchange="updateMapLayers()" class="w-4 h-4 text-emergency rounded">
                    <span class="text-sm">AED设备点</span>
                </label>
                <label class="flex items-center gap-2 py-2 px-3 cursor-pointer hover:bg-gray-50 rounded-lg">
                    <input type="checkbox" id="layer-buildings" checked onchange="updateMapLayers()" class="w-4 h-4 text-emergency rounded">
                    <span class="text-sm">建筑名称</span>
                </label>
                <label class="flex items-center gap-2 py-2 px-3 cursor-pointer hover:bg-gray-50 rounded-lg">
                    <input type="checkbox" id="layer-roads" onchange="updateMapLayers()" class="w-4 h-4 text-emergency rounded">
                    <span class="text-sm">道路标签</span>
                </label>
            </div>
        </div>

        <!-- 急救知识页 -->
        <div id="knowledge-page" class="absolute inset-0 bg-gray-50 overflow-y-auto page-hidden pb-20">
            <div class="p-4">
                <h2 class="text-xl font-black mb-1">急救知识</h2>
                <p class="text-sm text-gray-500 mb-4">关键时刻能救命的基础急救技能</p>
                
                <div id="knowledge-cards" class="grid grid-cols-1 gap-4">
                    <!-- 动态生成卡片 -->
                </div>
            </div>
        </div>

        <!-- 急救知识详情页 -->
        <div id="knowledge-detail-page" class="absolute inset-0 bg-white overflow-y-auto page-hidden z-30">
            <div class="sticky top-0 bg-white z-10 px-4 py-3 flex items-center gap-3 shadow-sm">
                <button onclick="closeKnowledgeDetail()" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="text-lg font-bold" id="detail-title">详情</div>
            </div>
            <div id="detail-content" class="p-4 pb-20">
                <!-- 动态生成内容 -->
            </div>
        </div>
    </main>

    <!-- AED详情弹窗 -->
    <div id="aed-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end">
        <div class="bg-white w-full rounded-t-3xl max-h-[85vh] overflow-y-auto modal-enter">
            <div class="sticky top-0 bg-white px-4 py-3 border-b flex items-center justify-between">
                <h3 class="text-lg font-bold">AED设备详情</h3>
                <button onclick="closeAEDModal()" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <div id="aed-modal-content" class="p-4">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>

    <!-- 紧急呼叫面板 -->
    <div id="emergency-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end">
        <div class="bg-white w-full rounded-t-3xl p-6 modal-enter">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
            <h2 class="text-2xl font-black text-center mb-2 text-emergency">紧急呼叫</h2>
            <p class="text-center text-gray-500 text-sm mb-6">请保持冷静，准确说明事发地点和情况</p>
            
            <div class="space-y-4">
                <button onclick="callNumber('120')" class="w-full bg-emergency hover:bg-emergency-dark text-white py-5 rounded-2xl shadow-xl card-press flex items-center justify-center gap-3">
                    <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                        </svg>
                    </div>
                    <div class="text-left">
                        <div class="text-2xl font-black">拨打 120</div>
                        <div class="text-sm text-white/80">急救中心</div>
                    </div>
                </button>

                <button onclick="callHospital()" class="w-full bg-medical hover:bg-teal-700 text-white py-5 rounded-2xl shadow-xl card-press flex items-center justify-center gap-3">
                    <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                    </div>
                    <div class="text-left">
                        <div class="text-2xl font-black" id="hospital-phone">010-12345678</div>
                        <div class="text-sm text-white/80" id="hospital-label">校医院 · 本部校区</div>
                    </div>
                </button>
            </div>
            <div class="mt-6 bg-amber-50 border border-amber-200 rounded-xl p-4">
                <div class="flex items-start gap-2">
                    <svg class="w-5 h-5 text-amber-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p class="text-sm text-amber-800">报警时请清晰说明：<br>• 具体位置（校区、楼栋、楼层）<br>• 患者当前状态<br>• 联系电话保持畅通</p>
                </div>
            </div>

            <button onclick="closeEmergencyModal()" class="w-full mt-4 py-3 text-gray-500 font-medium card-press">
                取消
            </button>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <nav id="bottom-nav" class="bottom-nav bg-white border-t border-gray-200 px-4 py-2 z-40">
        <div class="flex justify-around items-center max-w-lg mx-auto">
            <button onclick="switchTab('map')" id="nav-map" class="nav-btn flex flex-col items-center gap-1 py-2 px-4 rounded-xl transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-2.761 0-5 2.239-5 5s2.239 5 5 5 5-2.239 5-5-2.239-5-5-5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
                </svg>
                <span class="text-xs font-medium">AED地图</span>
            </button>
            
            <button onclick="switchTab('knowledge')" id="nav-knowledge" class="nav-btn flex flex-col items-center gap-1 py-2 px-4 rounded-xl transition-all text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
                <span class="text-xs font-medium">急救知识</span>
            </button>

            <button onclick="openEmergencyModal()" id="nav-emergency" class="flex flex-col items-center -mt-6">
                <div class="emergency-btn w-16 h-16 bg-emergency rounded-full shadow-xl shadow-red-200 flex items-center justify-center border-4 border-white">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                </div>
                <span class="text-xs font-bold text-emergency mt-1">紧急呼叫</span>
            </button>
        </div>
    </nav>

    <!-- 定位权限拒绝提示 -->
    <div id="location-denied" class="fixed top-20 left-4 right-4 bg-amber-50 border border-amber-200 rounded-xl p-4 z-40 hidden shadow-lg">
        <div class="flex items-start gap-2">
            <svg class="w-5 h-5 text-amber-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <div class="flex-1">
                <p class="text-sm text-amber-800 font-medium">无法获取您的位置</p>
                <p class="text-xs text-amber-700 mt-1">请允许定位权限，或手动在地图上点击选择您的位置</p>
                <button onclick="enableManualSelect()" class="mt-2 text-xs bg-amber-200 text-amber-800 px-3 py-1.5 rounded-lg font-medium">手动选择位置</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 数据层 ==========
        // 模拟校园中心坐标 (以北京某高校为例)
        const CAMPUS_CENTER = [39.532, 116.658];

     // WGS84 转 GCJ02 本地算法（中国大陆通用）
// 误差<1米，无网络请求，无跨域，离线可用
function convertWgs84ToGcj02(lat, lon) {
    // 中国坐标范围判断（国外坐标不转换）
    if (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271) {
        return [lat, lon];
    }

    const a = 6378245.0; // 地球长半轴
    const ee = 0.00669342162296594323; // 偏心率平方
    const pi = 3.14159265358979324;

    function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * pi) + 20.0 * Math.sin(2.0 * x * pi)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * pi) + 40.0 * Math.sin(y / 3.0 * pi)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * pi) + 320 * Math.sin(y * pi / 30.0)) * 2.0 / 3.0;
        return ret;
    }

    function transformLon(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * pi) + 20.0 * Math.sin(2.0 * x * pi)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * pi) + 40.0 * Math.sin(x / 3.0 * pi)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * pi) + 300.0 * Math.sin(x / 30.0 * pi)) * 2.0 / 3.0;
        return ret;
    }

    let dLat = transformLat(lon - 105.0, lat - 35.0);
    let dLon = transformLon(lon - 105.0, lat - 35.0);
    let radLat = lat / 180.0 * pi;
    let magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    let sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * pi);
    dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * pi);
    
    return [lat + dLat, lon + dLon];
}


function requestUserLocation() {
    if (!navigator.geolocation) {
        userLocation = CAMPUS_CENTER;
        updateUserMarker();
        calculateNearestAED();
        hideLoading();
        showLocationDenied();
        return;
    }

    navigator.geolocation.getCurrentPosition(
        
         (pos) => {
            // 1. 获取原始WGS84坐标
            const wgsLat = pos.coords.latitude;
            const wgsLng = pos.coords.longitude;
            
           
            // 直接调用，不需要异步
const [gcjLat, gcjLng] = convertWgs84ToGcj02(wgsLat, wgsLng);
            // 3. 存入全局变量
            userLocation = [gcjLat, gcjLng];
            
            // 4. 后续逻辑不变
            updateUserMarker();
            calculateNearestAED();
            hideLoading();
            document.getElementById('location-status').innerHTML = 
                '<div class="w-2 h-2 bg-green-500 rounded-full"></div><span>已定位</span>';
            map.setCenter(new TMap.LatLng(userLocation[0], userLocation[1]));
        },
        // 定位失败回调
        (err) => {
            userLocation = [39.532, 116.658];
            updateUserMarker();
            calculateNearestAED();
            hideLoading();
            showLocationDenied();
        },
        // 定位配置
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        
        
    );
}

             function calculateNearestAED() {
            if (!userLocation) return;

            let minDist = Infinity;
            let nearest = null;

            AED_DATA.features.forEach(feature => {
                const coords = feature.geometry.coordinates;
                const dist = calculateDistance(userLocation[0], userLocation[1], coords[1], coords[0]);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = feature.properties;
                }
            });

            nearestAED = nearest;
            showNearestAEDPanel(minDist);
        }
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(Math.max(0, 1 - a)));  // 保护精度
    return Math.round(R * c);
}
               function showNearestAEDPanel(distance) {
            const panel = document.getElementById('nearest-aed-panel');
            if (!nearestAED) return;

            document.getElementById('nearest-distance').textContent = distance < 1000 ? distance : (distance/1000).toFixed(1) + 'k';
            document.getElementById('nearest-time').textContent = Math.ceil(distance / 80); // 假设步行速度80米/分钟
            document.getElementById('nearest-name').textContent = nearestAED.name;
            document.getElementById('nearest-address').textContent = nearestAED.address;

            panel.classList.remove('hidden');
        }

                            <svg class="w-12 h-12 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>

                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="bg-gray-50 rounded-xl p-3">

                        <div class="text-sm font-bold text-gray-800">${props.hours}</div>

                    <div class="bg-gray-50 rounded-xl p-3">

                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 7m0 13V7"/>

            `;
            
            modal.classList.remove('hidden');
        }

        function closeAEDModal() {
            document.getElementById('aed-modal').classList.add('hidden');
        }

function navigateToAED(aedName) {
    // 1. 校验用户位置
    if (!userLocation || !Array.isArray(userLocation) || userLocation.length !== 2) {
        alert('请先允许获取您的位置信息，才能为您规划急救路线');
        return;
    }

    // 2. 获取AED坐标 [经度, 纬度]
    const destCoords = findAEDCoords(aedName);
    if (!destCoords || !Array.isArray(destCoords) || destCoords.length !== 2) {
        alert(`未找到「${aedName}」的位置信息`);
        return;
    }

    const lng = destCoords[0]; // 经度
    const lat = destCoords[1]; // 纬度

    // 3. 拼接正确导航链接（腾讯地图：纬度在前，经度在后）
    const YOUR_KEY = "6WOBZ-EEELQ-VSD5J-BQPIQ-Q2HQ6-AWFQN";
    const navUrl = `https://apis.map.qq.com/uri/v1/routeplan`
        + `?type=walk`
        + `&fromcoord=${userLocation[0]},${userLocation[1]}`  // 用户：纬度,经度
        + `&tocoord=${lat},${lng}`                            // AED：纬度,经度
        + `&from=我的位置`
        + `&to=${aedName}`
        + `&key=${YOUR_KEY}`;

    // 4. 跳转
    window.open(navUrl, '_blank');
}
              function findAEDCoords(name) {
            const feature = AED_DATA.features.find(f => f.properties.name === name);
            if (feature) {
                const coords = feature.geometry.coordinates;
                return [coords[0], coords[1]];
            }
            return null;
        }

     



        function navigateToNearest() {
            if (!nearestAED) return;
            navigateToAED(nearestAED.name, nearestAED.address);
        }

        function viewNearestDetail() {
            if (!nearestAED) return;
            openAEDModal(nearestAED);
        }

        // ========== 导航标签切换 ==========
        function switchTab(tab) {
            currentTab = tab;
            
            // 更新按钮状态
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-gray-400');
            });
            document.getElementById(`nav-${tab}`).classList.add('tab-active');
            document.getElementById(`nav-${tab}`).classList.remove('text-gray-400');

            // 显示对应页面
            document.getElementById('map-page').classList.add('page-hidden');
            document.getElementById('knowledge-page').classList.add('page-hidden');
            document.getElementById('knowledge-detail-page').classList.add('page-hidden');
            
            if (tab === 'map') {
                document.getElementById('map-page').classList.remove('page-hidden');
                           } else if (tab === 'knowledge') {
                document.getElementById('knowledge-page').classList.remove('page-hidden');
            }

            // 更新标题栏
            const subtitle = document.getElementById('header-subtitle');
            if (tab === 'map') {
                subtitle.textContent = '保护生命，分秒必争';
            } else if (tab === 'knowledge') {
                subtitle.textContent = '关键时刻能救命';
            }
        }

        // ========== 急救知识 ==========
        function renderKnowledgeCards() {
            const container = document.getElementById('knowledge-cards');
            container.innerHTML = KNOWLEDGE_DATA.map(k => `
                <div onclick="openKnowledgeDetail(${k.id})" class="card-press ${k.category} rounded-2xl p-5 text-white shadow-lg cursor-pointer">
                    <div class="flex items-start justify-between mb-3">
                        ${k.icon}
                        <svg class="w-5 h-5 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </div>
                    <h3 class="text-lg font-black mb-1">${k.title}</h3>
                    <p class="text-sm text-white/80 leading-relaxed">${k.summary}</p>
                </div>
            `).join('');
        }

        function openKnowledgeDetail(id) {
            const data = KNOWLEDGE_DATA.find(k => k.id === id);
            if (!data) return;

            document.getElementById('detail-title').textContent = data.title;
            document.getElementById('detail-content').innerHTML = `
                <div class="bg-emergency-light text-emergency text-sm font-medium px-4 py-3 rounded-xl mb-6">
                    💡 ${data.summary}
                </div>
                <div class="space-y-4">
                    ${data.steps.map((step, idx) => `
                        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
                            <div class="flex items-center gap-3 mb-2">
                                <div class="w-8 h-8 bg-emergency text-white rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0">${idx + 1}</div>
                                <div class="text-base font-bold text-gray-800">${step.title}</div>
                            </div>
                            <p class="text-sm text-gray-600 leading-relaxed pl-11">${step.desc}</p>
                        </div>
                    `).join('')}
                </div>
                <div class="mt-6 bg-amber-50 border border-amber-200 rounded-xl p-4">
                    <div class="flex items-start gap-2">
                        <svg class="w-5 h-5 text-amber-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p class="text-sm text-amber-800"><strong>注意：</strong>以上为现场急救指引，不能替代专业医疗救治。实施急救的同时请务必拨打120急救电话。</p>
                    </div>
                </div>
            `;

            document.getElementById('knowledge-detail-page').classList.remove('page-hidden');
        }

        function closeKnowledgeDetail() {
            document.getElementById('knowledge-detail-page').classList.add('page-hidden');
        }

        // ========== 紧急呼叫 ==========
        function openEmergencyModal() {
            document.getElementById('emergency-modal').classList.remove('hidden');
        }

        function closeEmergencyModal() {
            document.getElementById('emergency-modal').classList.add('hidden');
        }

        function callNumber(number) {
            window.location.href = `tel:${number}`;
        }

        function callHospital() {
            const phone = document.getElementById('hospital-phone').textContent;
            callNumber(phone);
        }

        // ========== 工具函数 ==========
        function hideLoading() {
            const loading = document.getElementById('loading-screen');
            setTimeout(() => {
                loading.style.opacity = '0';
                loading.style.transition = 'opacity 0.3s';
                setTimeout(() => loading.classList.add('hidden'), 300);
            }, 500);
        }

        function showLocationDenied() {
            setTimeout(() => {
                document.getElementById('location-denied').classList.remove('hidden');
            }, 2000);
        }

        // 点击遮罩关闭弹窗
        document.getElementById('aed-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('aed-modal')) closeAEDModal();
        });

        document.getElementById('emergency-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('emergency-modal')) closeEmergencyModal();
        });

        // 防止底部导航点击穿透
        document.getElementById('bottom-nav').addEventListener('touchstart', (e) => {
            e.stopPropagation();
        }, { passive: true });
    </script>
